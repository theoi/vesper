<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vesper audio lab</title>
    <style>
      body {
        font:
          14px/1.4 ui-monospace,
          monospace;
        background: #0e0c0a;
        color: #e8dcc4;
        padding: 1rem 1.5rem;
      }
      h2 {
        font-size: 14px;
        margin: 1.2rem 0 0.4rem;
        color: #c9a45c;
      }
      button {
        font: inherit;
        background: #241e17;
        color: inherit;
        border: 1px solid #4a3d2c;
        padding: 0.25rem 0.6rem;
        margin: 0 0.3rem 0.3rem 0;
        cursor: pointer;
      }
      button.on {
        background: #6b4f22;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      #meter {
        width: 240px;
        height: 10px;
        background: #241e17;
      }
      #meter div {
        height: 100%;
        width: 0;
        background: #c9a45c;
      }
      table {
        border-collapse: collapse;
        margin-top: 0.5rem;
      }
      td,
      th {
        padding: 0.1rem 0.7rem;
        text-align: right;
      }
      td:first-child,
      th:first-child {
        text-align: left;
      }
      .bad {
        color: #ff7a6b;
      }
    </style>
  </head>
  <body>
    <h1>Vesper audio lab</h1>
    <div class="row">
      <button id="begin">Begin</button>
      <button id="mute">Mute</button>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" /></label>
      <label
        >Tension <input id="tension" type="range" min="0" max="1" step="0.01" value="0"
      /></label>
      <div id="meter"><div></div></div>
      <span id="status"></span>
    </div>
    <h2>Scenes</h2>
    <div class="row" id="scenes"></div>
    <h2>Cues (click: next take; shift-click: pan left, alt-click: pan right)</h2>
    <div class="row" id="cues"></div>
    <h2>Checks</h2>
    <div class="row">
      <button id="check">Render levels</button>
      <button id="stress">Stress test</button>
    </div>
    <div id="out"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
